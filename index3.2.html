<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portada - Estilo Híbrido</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Oswald:wght@700&display=swap');

        body {
            margin: 0;
            padding: 40px 20px;
            /* Patrón de semitonos estilo cómic, ahora más sutil */
            background-color: #111111;
            background-image: radial-gradient(#d70a0a 1.5px, transparent 1.5px);
            background-size: 15px 15px;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 794px;
            min-height: 1050px;
            background: #ffffff;
            /* Sombra sólida estilo novela gráfica */
            box-shadow: 15px 15px 0px #d70a0a;
            border: 4px solid #000000;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* Corte diagonal en el fondo para dinamismo */
        .bg-slash {
            position: absolute;
            top: 0;
            right: -10%;
            width: 60%;
            height: 100%;
            background: #f4f4f4;
            clip-path: polygon(25% 0, 100% 0, 100% 100%, 0% 100%);
            z-index: 0;
        }

        .content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 60px;
        }

        .header-top {
            margin-bottom: 50px;
        }

        /* Títulos institucionales con giro de 360° en 0.5s */
        .tnm {
            font-family: 'Oswald', sans-serif;
            background-color: #000000;
            color: #ffffff;
            display: inline-block;
            padding: 10px 20px;
            font-size: 1.8rem;
            transform: skewX(-12deg);
            transform-origin: center center;
            margin-bottom: 10px;
            cursor: pointer;
            transition: transform 0.5s ease-in-out, box-shadow 0.5s ease-in-out;
        }

        .tnm:hover {
            transform: skewX(-12deg) rotate(360deg);
            box-shadow: 6px 6px 0px #d70a0a;
        }

        .itcv {
            font-family: 'Oswald', sans-serif;
            background-color: #d70a0a;
            color: #ffffff;
            display: inline-block;
            padding: 8px 15px;
            font-size: 1.2rem;
            transform: skewX(-12deg);
            transform-origin: center center;
            margin-left: 15px;
            cursor: pointer;
            transition: transform 0.5s ease-in-out, box-shadow 0.5s ease-in-out;
        }

        .itcv:hover {
            transform: skewX(-12deg) rotate(360deg);
            box-shadow: 6px 6px 0px #000000;
        }

        .middle-section {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .career {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 1.8rem;
            text-transform: uppercase;
            color: #000000;
            margin-bottom: 30px;
            letter-spacing: -1px;
        }

        .subject-box {
            font-family: 'Oswald', sans-serif;
            font-size: 1.5rem;
            color: #d70a0a;
            text-transform: uppercase;
            border-left: 6px solid #000000;
            padding-left: 15px;
            margin-bottom: 20px;
        }

        .activity { 
            font-family: 'Oswald', sans-serif;
            font-size: 4.5rem;
            color: #000000; 
            line-height: 0.95;
            text-transform: uppercase;
            margin: 10px 0 50px 0;
            text-shadow: 5px 5px 6px #d70a0a;
            transform: skewX(-6deg);
            letter-spacing: 1px;
        }

        /* Cuadro de datos con degradado de blanco a gris */
        .info-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: linear-gradient(135deg, #ffffff 0%, #dcdcdc 100%);
            border: 4px solid #000000;
            padding: 25px;
            width: 80%;
            transform: skewX(-5deg);
            box-shadow: 8px 8px 0px #000000;
        }

        /* Contrarrestamos la inclinación para que el texto sea legible */
        .info-item {
            transform: skewX(5deg); 
        }

        .info-item .label {
            font-family: 'Oswald', sans-serif;
            font-size: 1rem;
            color: #d70a0a;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .info-item .value {
            font-size: 1.2rem;
            color: #000000;
            font-weight: 700;
        }

        .bottom-section {
            margin-top: auto;
            display: flex;
            justify-content: flex-end;
        }

        .date {
            font-family: 'Oswald', sans-serif;
            background: #000000;
            color: #ffffff;
            padding: 10px 20px;
            font-size: 1.1rem;
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
        }

        /* Tu estrella decorativa original */
        .star {
            position: absolute;
            background: #d70a0a;
            width: 70px;
            height: 70px;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            z-index: 10;
            bottom: 80px;
            left: -25px;
            transform: rotate(15deg);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="bg-slash"></div>
        <div class="star"></div>
        
        <div class="content">
            <div class="header-top">
                <div class="tnm">TECNOLÓGICO NACIONAL DE MÉXICO</div><br>
                <div class="itcv">INSTITUTO TECNOLÓGICO DE CD. VALLES</div>
            </div>

            <div class="middle-section">
                <div class="career">Ingeniería en Sistemas Computacionales</div>
                
                <div class="subject-box">[Nombre de la Materia]</div>
                
                <div class="activity">TÍTULO DE LA<br>ACTIVIDAD</div>

                <div class="info-grid">
                    <div class="info-item">
                        <div class="label">Presenta</div>
                        <div class="value">Nombre del Alumno Apellidos</div>
                    </div>
                    <div class="info-item">
                        <div class="label">Docente</div>
                        <div class="value">Ing. Nombre del Docente</div>
                    </div>
                </div>
            </div>

            <div class="bottom-section">
                <div class="date">Cd. Valles, S.L.P., a 03 de Septiembre del 2026</div>
            </div>
        </div>
    </div>
</body>
</html>
