<!DOCTYPE html>
<html lang="es"> 
    <head> 
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title> Tablas y listas </title>
    </head>
    <body>
        <h2> lista ordenada </h2>
        <ol type="1">
            <li> México </li>
            <li> Alemania </li>
            <li> Francia </li>
            <li> España </li>
        </ol>

        <h2> lista desordenada </h2>
        <ul style="list-style-type: square;"> 
            <li> Jose </li>
            <li> Muller </li>
            <li> Charles </li>
        </ul>
        <table style="border: 3px solid hotpink;">
            <caption> Equipos </caption>
            <thead>
                <th> Nombre </th>
                <th> Liga </th>
                <th> País </th>
            </thead>
            <tbody>
                <tr>
                    <td> Chivas </td>
                    <td> Liga MX </td>
                    <td> México </td>
                </tr>
                <tr> 
                    <td> Bayern</td>
                    <td> Bundesliga </td>
                    <td> Alemania </td>
                </tr>
                <tr> 
                    <td> PSG</td>
                    <td> Ligue 1 </td>
                    <td> Francia </td>
                </tr>
                <tr> 
                    <td> Real Madrid </td>
                    <td> La liga </td>
                    <td> España </td>
                </tr>
            </tbody>
        </table>
        <a href="https://x.com/miseleccionmx?lang=en" target="_blank"style="color: hotpink; text-decoration: underline;" > @miseleccionmx </a>
    </body>

</html>
