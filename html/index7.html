<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gottfried Wilhelm Leibniz - P4 Style</title>
    <style>
        /* Fondo amarillo clásico de Persona 4 */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f5d100; 
            background-image: repeating-linear-gradient(
                45deg, 
                transparent, 
                transparent 15px, 
                rgba(0, 0, 0, 0.05) 15px, 
                rgba(0, 0, 0, 0.05) 30px
            );
            color: #000;
            margin: 0;
            padding: 30px 20px;
            display: flex;
            justify-content: center;
        }

        /* Contenedor principal con sombra dura (Hard Shadow) */
        #container {
            width: 100%;
            max-width: 850px;
            background-color: #ffffff;
            border: 5px solid #000000;
            box-shadow: 15px 15px 0px #000000;
            display: grid;
            grid-template-columns: 240px 1fr;
        }

        /* Encabezado */
        header {
            grid-column: 1 / -1;
            background-color: #000000;
            color: #f5d100;
            padding: 20px 25px;
            border-bottom: 5px solid #000;
        }

        header h1 { 
            margin: 0; 
            font-size: 28px; 
            font-family: 'Arial Black', Impact, sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
            transform: skewX(-5deg);
        }

        /* Menú lateral */
        nav {
            background-color: #111111;
            padding: 25px 20px;
            border-right: 5px solid #000;
        }

        nav b {
            display: inline-block;
            font-size: 22px;
            color: #ffffff;
            background-color: #000;
            padding: 5px 15px;
            margin-bottom: 25px;
            font-family: 'Arial Black', sans-serif;
            text-transform: uppercase;
            border: 3px solid #f5d100;
            transform: skewX(-10deg);
        }

        /* Botones del menú */
        nav span {
            display: block;
            padding: 12px 15px;
            margin-bottom: 12px;
            background-color: transparent;
            color: #ffffff;
            font-family: 'Arial Black', sans-serif;
            font-size: 16px;
            text-transform: uppercase;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        nav span:hover {
            background-color: #f5d100;
            color: #000000;
            border: 3px solid #000000;
            transform: scale(1.05) skewX(-10deg) translateX(10px);
            box-shadow: 6px 6px 0px #000000;
            z-index: 10;
        }

        /* Contenido principal */
        main {
            padding: 35px;
            min-height: 450px;
            font-size: 17px;
            font-weight: bold;
            line-height: 1.5;
            background: repeating-linear-gradient(
                -45deg, 
                #ffffff, 
                #ffffff 10px, 
                #f9f9f9 10px, 
                #f9f9f9 20px
            );
        }

        main h3 { 
            margin-top: 0; 
            background-color: #000000;
            color: #f5d100; 
            display: inline-block;
            padding: 8px 20px;
            font-family: 'Arial Black', sans-serif;
            text-transform: uppercase;
            transform: skewX(-10deg);
            border: 3px solid #f5d100;
            box-shadow: 5px 5px 0px #000000;
        }

        /* Estilos Semánticos HTML5 (Figure y Figcaption) */
        figure {
            margin: 25px 0 0 0;
            padding: 0;
            display: inline-block;
        }

        figure img {
            display: block;
            border: 4px solid #000000;
            box-shadow: 8px 8px 0px #f5d100, 12px 12px 0px #000000;
            max-width: 100%;
            height: 220px;
            object-fit: cover;
            transition: transform 0.2s;
        }

        figure img:hover {
            transform: rotate(-2deg) scale(1.02);
        }

        figcaption {
            margin-top: 20px;
            font-family: 'Arial Black', sans-serif;
            font-size: 14px;
            text-transform: uppercase;
            background-color: #000;
            color: #fff;
            padding: 5px 10px;
            display: inline-block;
            transform: skewX(-5deg);
        }

        /* Pie de página */
        footer {
            grid-column: 1 / -1;
            background-color: #f5d100;
            color: #000;
            text-align: center;
            padding: 15px;
            font-size: 14px;
            font-family: 'Arial Black', sans-serif;
            border-top: 5px solid #000;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div id="container">
    <header>
        <h1>Gottfried Wilhelm Leibniz</h1>
    </header>

    <nav>
        <b>Menú</b>
        <span onclick="cambiarInfo('home')">Home</span>
        <span onclick="cambiarInfo('Biografia')">Biografía</span>
        <span onclick="cambiarInfo('Poesia')">Poesía</span>
        <span onclick="cambiarInfo('Corriente')">Corriente</span>
        <span onclick="cambiarInfo('Frase matona')">Frase matona</span>
        <span onclick="cambiarInfo('Me gusta por:')">Me gusta por:</span>
    </nav>
    
    <main id="content">
        <p>Esta es la página de bienvenida. Selecciona una opción en el menú de la izquierda para desplegar la información.</p>
    </main>
    
    <footer>
        pura gente del tec
    </footer>
</div>

<script>
    function cambiarInfo(opcion) {
        const panel = document.getElementById('content');

        if (opcion === 'home') {
            panel.innerHTML = "<p>Esta es la página de bienvenida. Selecciona una opción en el menú de la izquierda para desplegar la información.</p>";
        } else if (opcion === 'Biografia') {
            // Uso de etiquetas HTML5 <figure> y <figcaption>
            panel.innerHTML = `
                <h3>Biografía</h3>
                <p>Nació en Leipzig, Alemania, en 1646. Demostró ser un prodigio desde temprano, dominando el latín de forma autodidacta en la biblioteca de su padre antes de los diez años.</p>
                <figure>
                    <img src='gettyimages-525516272-594x594.jpg' alt='Retrato de Gottfried Wilhelm Leibniz'>
                    <figcaption>Gottfried Wilhelm Leibniz</figcaption>
                </figure>
            `;
        } else if (opcion === 'Poesia') {
            panel.innerHTML = `
                <h3>Poesía</h3>
                <p>Aunque no es recordado principalmente como poeta, Leibniz compuso una cantidad considerable de versos, panegíricos y epigramas en latín, francés y alemán.</p>
                <figure>
                    <img src='gettyimages-1155693629-594x594.jpg' alt='Poesía de Leibniz'>
                    <figcaption>Textos poéticos</figcaption>
                </figure>
            `;
        } else if (opcion === 'Corriente') {
            panel.innerHTML = `
                <h3>Corriente</h3>
                <p>Junto con René Descartes y Baruch Spinoza, es uno de los pilares del racionalismo del siglo XVII.</p>
                <figure>
                    <img src='2a3c550cc7e86e943696ee0529620811.jpg' alt='Corriente filosófica'>
                    <figcaption>Racionalismo del siglo XVII</figcaption>
                </figure>
            `;
        } else if (opcion === 'Frase matona') {
            panel.innerHTML = `
                <h3>Frase matona</h3>
                <p><em>"La música es el ejercicio aritmético oculto de un alma que no sabe que está calculando."</em></p>
                <figure>
                    <img src='gettyimages-1155693629-594x594.jpg' alt='Frase de Leibniz'>
                    <figcaption>Ejercicio aritmético oculto</figcaption>
                </figure>
            `;
        } else if (opcion === 'Me gusta por:') {
            panel.innerHTML = `
                <h3>Me gusta por:</h3>
                <p>Me gusta por ser de los pocos en ver el lado bueno de las cosas.</p>
                <figure>
                    <img src='gettyimages-525516272-594x594.jpg' alt='Me gusta'>
                    <figcaption>El mejor de los mundos</figcaption>
                </figure>
            `;
        }
    }
</script>
</body>
</html>
